<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chiptune Lute · Tone.js</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #1a1e2a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    .card {
      background: #2a2f3f;
      padding: 2rem 2.5rem;
      border-radius: 2.5rem;
      box-shadow: 0 15px 30px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.08);
      backdrop-filter: blur(2px);
      transition: 0.2s;
    }
    .gui {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      align-items: center;
    }
    .title {
      color: #b7c9e2;
      font-weight: 400;
      letter-spacing: 2px;
      font-size: 1.1rem;
      text-transform: uppercase;
      border-bottom: 1px solid #3f465b;
      padding-bottom: 0.6rem;
      width: 100%;
      text-align: center;
      text-shadow: 0 2px 3px #0f111a;
    }
    .keyboard {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
      max-width: 500px;
      margin: 0.2rem 0;
    }
    .lute-key {
      background: #323a4e;
      border: none;
      border-radius: 2rem 1rem 1rem 2rem;
      padding: 0.5rem 1.1rem;
      font-size: 1.3rem;
      font-weight: 600;
      color: #d6e3ff;
      box-shadow: 0 6px 0 #151b26, 0 8px 12px rgba(0,0,0,0.4);
      cursor: pointer;
      transition: all 0.04s ease;
      min-width: 48px;
      text-align: center;
      letter-spacing: 1px;
      border-left: 3px solid #5f6b88;
      font-family: 'Courier New', monospace;
    }
    .lute-key:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 #151b26, 0 6px 10px rgba(0,0,0,0.5);
      background: #3e485f;
    }
    .lute-key:focus-visible {
      outline: 2px solid #b0c7f0;
      outline-offset: 3px;
    }
    .lute-key[data-note="C4"] { border-left-color: #f7b773; }
    .lute-key[data-note="D4"] { border-left-color: #f5a77a; }
    .lute-key[data-note="E4"] { border-left-color: #f09b7a; }
    .lute-key[data-note="F4"] { border-left-color: #e88f7a; }
    .lute-key[data-note="G4"] { border-left-color: #d9837a; }
    .lute-key[data-note="A4"] { border-left-color: #c97a7a; }
    .lute-key[data-note="B4"] { border-left-color: #b8737a; }
    .lute-key[data-note="C5"] { border-left-color: #a86d7a; }
    .lute-key[data-note="D5"] { border-left-color: #98687a; }
    .lute-key[data-note="E5"] { border-left-color: #88637a; }
    .controls {
      display: flex;
      gap: 2.5rem;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      margin-top: 0.2rem;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      background: #232836;
      padding: 0.3rem 1rem 0.3rem 1.2rem;
      border-radius: 3rem;
      box-shadow: inset 0 2px 6px #0e121b;
    }
    .control-group label {
      color: #b3c5e6;
      font-size: 0.8rem;
      letter-spacing: 1px;
      font-weight: 300;
    }
    .control-group input[type="range"] {
      width: 90px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: #4d5773;
      border-radius: 10px;
      outline: none;
    }
    .control-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #b7cef0;
      cursor: pointer;
      box-shadow: 0 2px 6px #0a0e17;
      border: 1px solid #d3e2ff;
    }
    .value-badge {
      min-width: 30px;
      color: #d6e3ff;
      font-size: 0.9rem;
      font-weight: 500;
      background: #1b212e;
      padding: 0.1rem 0.5rem;
      border-radius: 20px;
      text-align: center;
    }
    .footer {
      color: #5f6d8a;
      font-size: 0.7rem;
      letter-spacing: 1px;
      margin-top: 0.3rem;
    }
    .standalone-badge {
      background: #2b3347;
      padding: 0.2rem 1rem;
      border-radius: 30px;
      color: #8f9fc7;
      font-size: 0.65rem;
      border: 1px solid #3d465e;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="gui">
    <div class="title">🎸 · CHIPTUNE LUTE</div>

    <!-- KEYBOARD (GUI) -->
    <div class="keyboard" id="keyboardContainer">
      <!-- keys will be injected by JS -->
    </div>

    <!-- CONTROLS (GUI) -->
    <div class="controls">
      <div class="control-group">
        <label>✨ decay</label>
        <input type="range" id="decaySlider" min="0.05" max="1.2" step="0.01" value="0.45">
        <span class="value-badge" id="decayValue">0.45</span>
      </div>
      <div class="control-group">
        <label>🔊 gain</label>
        <input type="range" id="gainSlider" min="0.1" max="1.0" step="0.01" value="0.55">
        <span class="value-badge" id="gainValue">0.55</span>
      </div>
    </div>
    <div class="standalone-badge">⚡ instrument standalone · GUI separate</div>
    <div class="footer">click keys · chiptune pluck</div>
  </div>
</div>

<!-- ============================================================ -->
<!--  TONE.JS LIBRARY                                              -->
<!-- ============================================================ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>

<script>
  (function() {
    "use strict";

    // --------------------------------------------------------------
    // 1. INSTRUMENT MODULE (standalone, no GUI references)
    //    - ChiptuneLute: uses Tone.Synth with chiptune-style oscillator
    //    - Exposes playNote(note, decayTime, gainValue)
    // --------------------------------------------------------------
    class ChiptuneLute {
      /**
       * @param {Object} params
       * @param {number} [params.decay=0.45]  - decay time in seconds
       * @param {number} [params.gain=0.55]   - output gain (0–1)
       */
      constructor(params = {}) {
        // --- core synth: chiptune lute with square wave ---
        this.synth = new Tone.Synth({
          oscillator: {
            type: 'square8',       // chiptune classic with 8 partials
          },
          envelope: {
            attack: 0.002,
            decay: params.decay ?? 0.45,
            sustain: 0.0,           // pluck-style: no sustain
            release: 0.05,
          },
          volume: -8,               // headroom
        }).toDestination();

        // extra gain stage for finer control
        this.gainNode = new Tone.Gain(params.gain ?? 0.55);
        this.synth.chain(this.gainNode, Tone.Destination);

        // store current params
        this._decay = params.decay ?? 0.45;
        this._gain = params.gain ?? 0.55;

        // store the oscillator reference for detune
        this._oscillator = this.synth.oscillator;
      }

      /** Play a note (frequency or note name) */
      playNote(note, decayTime = this._decay, gainValue = this._gain) {
        if (!Tone.context.state || Tone.context.state === 'suspended') {
          Tone.context.resume();   // required for WebAudio autoplay policy
        }

        // update envelope decay (if different)
        if (decayTime !== this._decay) {
          this.synth.envelope.decay = decayTime;
          this._decay = decayTime;
        }

        // update gain (if different)
        if (gainValue !== this._gain) {
          this.gainNode.gain.value = gainValue;
          this._gain = gainValue;
        }

        // extra chiptune "lute" touch: tiny random detune (±5 cents)
        // Use the set method for detune (read-only property fix)
        const detuneCents = (Math.random() * 10 - 5);
        this._oscillator.set({ detune: detuneCents });

        // trigger the note with a short duration
        this.synth.triggerAttackRelease(note, '8n');
      }

      /** Update decay time (seconds) */
      setDecay(time) {
        this._decay = Math.min(1.5, Math.max(0.02, time));
        this.synth.envelope.decay = this._decay;
      }

      /** Update gain (0–1) */
      setGain(val) {
        this._gain = Math.min(1.0, Math.max(0.0, val));
        this.gainNode.gain.value = this._gain;
      }

      /** Dispose and clean up */
      dispose() {
        this.synth.dispose();
        this.gainNode.dispose();
      }
    }

    // --------------------------------------------------------------
    // 2. GUI CONTROLLER (separate from instrument logic)
    //    - builds keyboard, binds sliders, updates instrument
    // --------------------------------------------------------------
    class LuteGUI {
      /**
       * @param {ChiptuneLute} instrument 
       */
      constructor(instrument) {
        this.instrument = instrument;

        // DOM elements
        this.keyboardEl = document.getElementById('keyboardContainer');
        this.decaySlider = document.getElementById('decaySlider');
        this.decayValue = document.getElementById('decayValue');
        this.gainSlider = document.getElementById('gainSlider');
        this.gainValue = document.getElementById('gainValue');

        // notes in the chiptune lute range (C4 – E5)
        this.notes = [
          'C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4',
          'C5', 'D5', 'E5'
        ];

        // build keyboard
        this.buildKeyboard();

        // bind controls
        this.bindSliders();

        // optional: resume audio on first user interaction
        this.resumeAudioOnInteraction();
      }

      buildKeyboard() {
        this.keyboardEl.innerHTML = ''; 
        for (const note of this.notes) {
          const btn = document.createElement('button');
          btn.className = 'lute-key';
          btn.dataset.note = note;
          // display note name (short)
          btn.textContent = note.replace('4', '').replace('5', ''); 
          btn.setAttribute('aria-label', `Play ${note}`);
          
          // event: play note
          btn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            this.playNoteFromGUI(note);
          });
          btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            this.playNoteFromGUI(note);
          }, { passive: false });
          this.keyboardEl.appendChild(btn);
        }
      }

      // central note trigger: uses instrument, reads current slider values
      playNoteFromGUI(note) {
        const decay = parseFloat(this.decaySlider.value);
        const gain = parseFloat(this.gainSlider.value);
        this.instrument.playNote(note, decay, gain);
        // update badges (optional feedback)
        this.decayValue.textContent = decay.toFixed(2);
        this.gainValue.textContent = gain.toFixed(2);
      }

      bindSliders() {
        // decay slider
        this.decaySlider.addEventListener('input', () => {
          const val = parseFloat(this.decaySlider.value);
          this.decayValue.textContent = val.toFixed(2);
          this.instrument.setDecay(val);
        });

        // gain slider
        this.gainSlider.addEventListener('input', () => {
          const val = parseFloat(this.gainSlider.value);
          this.gainValue.textContent = val.toFixed(2);
          this.instrument.setGain(val);
        });

        // set initial values from sliders
        this.instrument.setDecay(parseFloat(this.decaySlider.value));
        this.instrument.setGain(parseFloat(this.gainSlider.value));
        this.decayValue.textContent = this.decaySlider.value;
        this.gainValue.textContent = this.gainSlider.value;
      }

      // Resume audio context on any user interaction (required by browsers)
      resumeAudioOnInteraction() {
        const resume = () => {
          if (Tone.context.state === 'suspended') {
            Tone.context.resume();
          }
        };
        document.addEventListener('click', resume, { once: false });
        document.addEventListener('touchstart', resume, { once: false });
        document.addEventListener('keydown', resume, { once: false });
      }
    }

    // --------------------------------------------------------------
    // 3. INSTANTIATE & START
    // --------------------------------------------------------------
    const lute = new ChiptuneLute({ decay: 0.45, gain: 0.55 });
    const gui = new LuteGUI(lute);

    // handle page unload: dispose
    window.addEventListener('beforeunload', () => {
      lute.dispose();
    });

  })();
</script>
</body>
</html>
