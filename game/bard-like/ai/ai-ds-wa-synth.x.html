<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebAudio Synth - Playable Melody Keyboard</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }
        body {
            background: linear-gradient(145deg, #1a1e2c 0%, #2b3042 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .synth-container {
            max-width: 1200px;
            width: 100%;
            background: rgba(22, 26, 40, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 30px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.08);
            border: 1px solid #4a506a;
            color: #e8edf5;
        }
        h1 {
            font-weight: 400;
            font-size: 1.9rem;
            letter-spacing: 1px;
            margin-top: 0;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #3f455e;
            padding-bottom: 16px;
        }
        h1 small {
            font-size: 0.9rem;
            font-weight: 300;
            opacity: 0.6;
            margin-left: 8px;
        }
        .keyboard-section {
            background: #1a1f33;
            border-radius: 28px;
            padding: 20px 18px;
            margin: 16px 0 20px;
            border: 1px solid #3f4663;
        }
        .keyboard {
            display: flex;
            justify-content: center;
            gap: 2px;
            margin: 10px 0 12px;
            flex-wrap: wrap;
        }
        .key {
            width: 42px;
            height: 140px;
            background: #f0f0f0;
            border-radius: 0 0 6px 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 8px;
            font-size: 0.6rem;
            color: #333;
            font-weight: 600;
            transition: 0.05s ease;
            border: 2px solid #aaa;
            border-top: none;
            position: relative;
        }
        .key.black {
            width: 28px;
            height: 90px;
            background: #222;
            border-color: #111;
            color: #fff;
            margin: 0 -14px;
            z-index: 2;
            border-radius: 0 0 4px 4px;
            font-size: 0.5rem;
        }
        .key.active {
            background: #7b8aff !important;
            transform: scale(0.96);
            border-color: #5a6fd6;
        }
        .key.black.active {
            background: #5a6fd6 !important;
        }
        .key:hover {
            background: #ddd;
        }
        .key.black:hover {
            background: #444;
        }
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0 6px;
        }
        .controls-row button {
            background: #3f4670;
            border: none;
            color: white;
            font-size: 0.9rem;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 4px 0 #1d2137;
            transition: 0.06s ease;
            border: 1px solid #6b74a2;
        }
        .controls-row button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1d2137;
        }
        .controls-row button.record {
            background: #7a3a5a;
            border-color: #b05a7a;
        }
        .controls-row button.record.active {
            background: #d44a6a;
            animation: pulse 0.8s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .melody-display {
            background: #0d1120;
            border-radius: 20px;
            padding: 10px 16px;
            font-family: monospace;
            font-size: 0.8rem;
            min-height: 40px;
            border: 1px solid #3a405e;
            margin-top: 8px;
            overflow-x: auto;
            white-space: nowrap;
            color: #bcc6e6;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 18px;
        }
        .osc-card {
            background: #262b3f;
            border-radius: 24px;
            padding: 14px 14px 16px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6), 0 6px 12px rgba(0,0,0,0.3);
            border: 1px solid #3c425e;
        }
        .osc-card h3 {
            display: flex;
            justify-content: space-between;
            margin: 0 0 10px 0;
            font-weight: 400;
            font-size: 1rem;
            color: #bcc6e6;
        }
        .control-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 10px;
            margin-bottom: 8px;
        }
        .control-row label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.7;
            min-width: 30px;
        }
        .control-row input[type="range"] {
            flex: 1;
            min-width: 50px;
            accent-color: #9aa9ff;
            background: #191e30;
            height: 3px;
            border-radius: 10px;
        }
        .control-row select {
            background: #1b2035;
            color: #d6defa;
            border: 1px solid #3d4462;
            border-radius: 40px;
            padding: 2px 10px;
            font-size: 0.7rem;
        }
        .lfo-badge {
            display: inline-block;
            background: #2f3650;
            border-radius: 40px;
            padding: 2px 10px 2px 6px;
            font-size: 0.6rem;
            border-left: 2px solid #7b8aff;
        }
        .filter-section {
            background: #1f243b;
            border-radius: 24px;
            padding: 14px 18px;
            margin: 10px 0 14px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 16px;
            border: 1px solid #3f4663;
        }
        .filter-section .group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-section .group label {
            font-size: 0.65rem;
            opacity: 0.7;
        }
        .filter-section input[type="range"] {
            width: 70px;
            accent-color: #b7a6ff;
        }
        .reverb-box {
            background: #1b2037;
            border-radius: 40px;
            padding: 4px 14px 4px 10px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #4b5272;
        }
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1b2037;
            padding: 4px 14px 4px 10px;
            border-radius: 40px;
            border: 1px solid #4b5272;
        }
        .volume-control input[type="range"] {
            width: 80px;
            accent-color: #ffb07c;
        }
        .lfo-module {
            background: #1a1f33;
            border-radius: 16px;
            padding: 8px 12px;
            border: 1px solid #3a405e;
        }
        .lfo-module .lfo-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .lfo-module .lfo-row label {
            font-size: 0.6rem;
            opacity: 0.6;
            min-width: 24px;
        }
        .lfo-module .lfo-row input[type="range"] {
            width: 60px;
            accent-color: #ff9a9e;
        }
        .lfo-module .lfo-row select {
            font-size: 0.6rem;
            padding: 1px 6px;
        }
        .module-label {
            font-size: 0.65rem;
            font-weight: 300;
            opacity: 0.8;
        }
        @media (max-width: 800px) {
            .grid-3 { grid-template-columns: 1fr; }
            .key { width: 32px; height: 100px; }
            .key.black { width: 22px; height: 65px; margin: 0 -11px; }
        }
    </style>
</head>
<body>
<div class="synth-container">
    <h1>🎹 MELODY SYNTH <small>click keys · record · play</small></h1>

    <!-- Keyboard -->
    <div class="keyboard-section">
        <div class="keyboard" id="keyboard"></div>
        <div class="controls-row">
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button id="recordBtn" class="record">⏺ RECORD</button>
                <button id="playMelodyBtn">▶ PLAY MELODY</button>
                <button id="clearMelodyBtn">✕ CLEAR</button>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
                <span style="font-size:0.7rem; opacity:0.6;">tempo</span>
                <input type="range" id="tempo" min="60" max="240" value="120" style="width:80px;">
                <span id="tempoLabel" style="font-size:0.7rem;">120</span>
            </div>
        </div>
        <div class="melody-display" id="melodyDisplay">🎵 Click keys to play a melody, press RECORD to capture</div>
    </div>

    <!-- 3 oscillators -->
    <div class="grid-3" id="oscContainer"></div>

    <!-- Filter + Gain ADSR -->
    <div class="filter-section">
        <div class="group">
            <span style="font-weight:300; font-size:0.8rem;">🎛️ FILTER</span>
            <label>A</label><input type="range" id="fAttack" min="0.001" max="0.5" step="0.001" value="0.01">
            <label>D</label><input type="range" id="fDecay" min="0.01" max="0.8" step="0.01" value="0.1">
            <label>S</label><input type="range" id="fSustain" min="0" max="1" step="0.01" value="0.5">
            <label>R</label><input type="range" id="fRelease" min="0.01" max="0.8" step="0.01" value="0.05">
        </div>
        <div class="group">
            <span style="font-weight:300; font-size:0.8rem;">🎚️ GAIN</span>
            <label>A</label><input type="range" id="gAttack" min="0.001" max="0.5" step="0.001" value="0.005">
            <label>D</label><input type="range" id="gDecay" min="0.01" max="0.8" step="0.01" value="0.05">
            <label>S</label><input type="range" id="gSustain" min="0" max="1" step="0.01" value="0.7">
            <label>R</label><input type="range" id="gRelease" min="0.01" max="0.8" step="0.01" value="0.05">
        </div>
    </div>

    <!-- LFO Controls -->
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px;">
        <div class="lfo-module">
            <span class="module-label">🌀 FILTER LFO</span>
            <div class="lfo-row">
                <label>rate</label><input type="range" id="filterLfoRate" min="0.1" max="12" step="0.1" value="3.2">
                <label>depth</label><input type="range" id="filterLfoDepth" min="0" max="300" step="1" value="150">
                <select id="filterLfoWave"><option value="sine">sine</option><option value="square">square</option><option value="sawtooth">sawtooth</option><option value="triangle">triangle</option></select>
            </div>
        </div>
        <div class="lfo-module">
            <span class="module-label">🌀 GAIN LFO</span>
            <div class="lfo-row">
                <label>rate</label><input type="range" id="gainLfoRate" min="0.1" max="12" step="0.1" value="2.7">
                <label>depth</label><input type="range" id="gainLfoDepth" min="0" max="0.5" step="0.01" value="0.15">
                <select id="gainLfoWave"><option value="sine">sine</option><option value="square">square</option><option value="sawtooth">sawtooth</option><option value="triangle">triangle</option></select>
            </div>
        </div>
        <div class="lfo-module">
            <span class="module-label">🌀 REVERB LFO</span>
            <div class="lfo-row">
                <label>rate</label><input type="range" id="reverbLfoRate" min="0.1" max="12" step="0.1" value="0.6">
                <label>depth</label><input type="range" id="reverbLfoDepth" min="0" max="0.3" step="0.01" value="0.08">
                <select id="reverbLfoWave"><option value="sine">sine</option><option value="square">square</option><option value="sawtooth">sawtooth</option><option value="triangle">triangle</option></select>
            </div>
        </div>
    </div>

    <!-- Reverb + Master -->
    <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;">
        <div class="reverb-box">
            <span style="opacity:0.7; font-size:0.8rem;">⏳ REVERB</span>
            <label style="font-size:0.65rem;">wet</label><input type="range" id="reverbWet" min="0" max="1" step="0.01" value="0.2">
            <label style="font-size:0.65rem;">decay</label><input type="range" id="reverbDecay" min="0.1" max="3.0" step="0.1" value="1.0">
        </div>
        <div class="volume-control">
            <span style="opacity:0.7; font-size:0.8rem;">🔊</span>
            <input type="range" id="masterVolume" min="0" max="1" step="0.01" value="0.7">
        </div>
        <div style="display:flex; gap:8px;">
            <button id="panicBtn" style="background:#5a3a40; border-color:#8a5a62;">🔇 PANIC</button>
        </div>
    </div>
</div>
<script type='text/javascript' src='./ai-ds-wa-synth.4.js'></script>
</body>
</html>
