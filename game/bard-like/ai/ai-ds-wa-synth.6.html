<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Synth - Dark Fantasy Synthesizer</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }
        body {
            background: linear-gradient(145deg, #0a0a12 0%, #1a1420 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .synth-container {
            max-width: 1200px;
            width: 100%;
            background: rgba(16, 14, 26, 0.92);
            backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 30px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), inset 0 1px 2px rgba(180, 150, 200, 0.05);
            border: 1px solid #3a2a3e;
            color: #d4c8d4;
        }
        h1 {
            font-weight: 400;
            font-size: 1.9rem;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #3a2a3e;
            padding-bottom: 16px;
            color: #c4b0c4;
            text-shadow: 0 0 20px rgba(180, 120, 200, 0.1);
        }
        h1 small {
            font-size: 0.8rem;
            font-weight: 300;
            opacity: 0.5;
            margin-left: 8px;
            letter-spacing: 1px;
        }
        .preset-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            background: #1a1422;
            border-radius: 40px;
            padding: 8px 18px;
            border: 1px solid #3a2a3e;
            margin-bottom: 16px;
        }
        .preset-bar button {
            background: #2a1a32;
            border: 1px solid #5a3a5e;
            color: #d4c0d4;
            padding: 6px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .preset-bar button:hover {
            background: #3a2a4a;
            border-color: #8a5a8e;
        }
        .preset-bar button.active {
            background: #4a2a5a;
            border-color: #aa7aae;
            box-shadow: 0 0 20px rgba(150, 80, 180, 0.2);
        }
        .keyboard-section {
            background: #120e1a;
            border-radius: 28px;
            padding: 20px 18px;
            margin: 16px 0 20px;
            border: 1px solid #2a1a2e;
        }
        .keyboard {
            display: flex;
            justify-content: center;
            gap: 2px;
            margin: 10px 0 12px;
            flex-wrap: wrap;
        }
        .key {
            width: 42px;
            height: 140px;
            background: #d4c8d4;
            border-radius: 0 0 6px 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 8px;
            font-size: 0.6rem;
            color: #2a1a2a;
            font-weight: 600;
            transition: 0.05s ease;
            border: 2px solid #8a7a8a;
            border-top: none;
            position: relative;
        }
        .key.black {
            width: 28px;
            height: 90px;
            background: #1a0a1a;
            border-color: #0a000a;
            color: #b0a0b0;
            margin: 0 -14px;
            z-index: 2;
            border-radius: 0 0 4px 4px;
            font-size: 0.5rem;
        }
        .key.active {
            background: #b080c0 !important;
            transform: scale(0.96);
            border-color: #9050a0;
        }
        .key.black.active {
            background: #804090 !important;
        }
        .key:hover {
            background: #c0b0c0;
        }
        .key.black:hover {
            background: #2a1a2a;
        }
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0 6px;
        }
        .controls-row button {
            background: #2a1a32;
            border: 1px solid #4a3a4e;
            color: #d4c0d4;
            font-size: 0.9rem;
            padding: 8px 20px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
        }
        .controls-row button:hover {
            background: #3a2a4a;
            border-color: #6a4a6e;
        }
        .controls-row button.record {
            background: #3a1a2a;
            border-color: #6a2a4a;
        }
        .controls-row button.record.active {
            background: #6a2a4a;
            border-color: #aa4a7a;
            animation: pulse 0.8s infinite;
        }
        .controls-row button.dungeon {
            background: #1a1a2a;
            border-color: #4a3a5a;
            color: #b090c0;
        }
        .controls-row button.dungeon:hover {
            background: #2a2a4a;
            border-color: #6a4a7a;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .melody-display {
            background: #0a0610;
            border-radius: 20px;
            padding: 10px 16px;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            min-height: 40px;
            border: 1px solid #2a1a2e;
            margin-top: 8px;
            overflow-x: auto;
            white-space: nowrap;
            color: #b090b0;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 18px;
        }
        .osc-card {
            background: #1a1422;
            border-radius: 24px;
            padding: 14px 14px 16px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6), 0 6px 12px rgba(0,0,0,0.3);
            border: 1px solid #2a1a2e;
        }
        .osc-card h3 {
            display: flex;
            justify-content: space-between;
            margin: 0 0 10px 0;
            font-weight: 400;
            font-size: 1rem;
            color: #b0a0b0;
        }
        .control-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 10px;
            margin-bottom: 8px;
        }
        .control-row label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.6;
            min-width: 28px;
        }
        .control-row input[type="range"] {
            flex: 1;
            min-width: 50px;
            accent-color: #7a4a8a;
            background: #0a0610;
            height: 3px;
            border-radius: 10px;
        }
        .control-row select {
            background: #0a0610;
            color: #b0a0b0;
            border: 1px solid #2a1a2e;
            border-radius: 40px;
            padding: 2px 10px;
            font-size: 0.7rem;
        }
        .lfo-badge {
            display: inline-block;
            background: #1a0a22;
            border-radius: 40px;
            padding: 2px 10px 2px 6px;
            font-size: 0.6rem;
            border-left: 2px solid #7a4a8a;
        }
        .filter-section {
            background: #1a1422;
            border-radius: 24px;
            padding: 14px 18px;
            margin: 10px 0 14px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 16px;
            border: 1px solid #2a1a2e;
        }
        .filter-section .group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-section .group label {
            font-size: 0.6rem;
            opacity: 0.6;
        }
        .filter-section input[type="range"] {
            width: 60px;
            accent-color: #7a4a8a;
        }
        .reverb-box {
            background: #120e1a;
            border-radius: 40px;
            padding: 4px 14px 4px 10px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #2a1a2e;
        }
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #120e1a;
            padding: 4px 14px 4px 10px;
            border-radius: 40px;
            border: 1px solid #2a1a2e;
        }
        .volume-control input[type="range"] {
            width: 80px;
            accent-color: #7a4a8a;
        }
        .lfo-module {
            background: #120e1a;
            border-radius: 16px;
            padding: 8px 12px;
            border: 1px solid #2a1a2e;
        }
        .lfo-module .lfo-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .lfo-module .lfo-row label {
            font-size: 0.55rem;
            opacity: 0.6;
            min-width: 22px;
        }
        .lfo-module .lfo-row input[type="range"] {
            width: 55px;
            accent-color: #7a4a8a;
        }
        .lfo-module .lfo-row select {
            font-size: 0.55rem;
            padding: 1px 6px;
            background: #0a0610;
            color: #b0a0b0;
            border: 1px solid #2a1a2e;
        }
        .module-label {
            font-size: 0.6rem;
            font-weight: 300;
            opacity: 0.7;
        }
        .dungeon-badge {
            background: #2a1a2a;
            border: 1px solid #4a3a4a;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.6rem;
            color: #b090b0;
            letter-spacing: 1px;
        }
        @media (max-width: 800px) {
            .grid-3 { grid-template-columns: 1fr; }
            .key { width: 32px; height: 100px; }
            .key.black { width: 22px; height: 65px; margin: 0 -11px; }
        }
    </style>
</head>
<body>
<div class="synth-container">
    <h1>⚔️ DUNGEON SYNTH <small>dark fantasy · lo-fi · medieval</small></h1>

    <!-- Preset Bar -->
    <div class="preset-bar">
        <span style="opacity:0.5; font-size:0.8rem;">🏰</span>
        <button class="active" id="dungeonPreset">DUNGEON</button>
        <button id="cathedralPreset">CATHEDRAL</button>
        <button id="goblinPreset">GOBLIN</button>
        <button id="resetPreset">⟲ RESET</button>
        <span class="dungeon-badge">⚡ dark magic</span>
    </div>

    <!-- Keyboard -->
    <div class="keyboard-section">
        <div class="keyboard" id="keyboard"></div>
        <div class="controls-row">
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button id="recordBtn" class="record">⏺ RECORD</button>
                <button id="playMelodyBtn">▶ PLAY MELODY</button>
                <button id="clearMelodyBtn">✕ CLEAR</button>
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
                <span style="font-size:0.7rem; opacity:0.5;">tempo</span>
                <input type="range" id="tempo" min="60" max="180" value="90" style="width:80px;">
                <span id="tempoLabel" style="font-size:0.7rem;">90</span>
            </div>
        </div>
        <div class="melody-display" id="melodyDisplay">🎵 summon ancient melodies... click keys to play</div>
    </div>

    <!-- 3 oscillators -->
    <div class="grid-3" id="oscContainer"></div>

    <!-- Filter + Gain ADSR -->
    <div class="filter-section">
        <div class="group">
            <span style="font-weight:300; font-size:0.75rem;">🎛️ FILTER</span>
            <label>A</label><input type="range" id="fAttack" min="0.001" max="1.0" step="0.001" value="0.15">
            <label>D</label><input type="range" id="fDecay" min="0.01" max="1.0" step="0.01" value="0.3">
            <label>S</label><input type="range" id="fSustain" min="0" max="1" step="0.01" value="0.3">
            <label>R</label><input type="range" id="fRelease" min="0.01" max="1.5" step="0.01" value="0.6">
        </div>
        <div class="group">
            <span style="font-weight:300; font-size:0.75rem;">🎚️ GAIN</span>
            <label>A</label><input type="range" id="gAttack" min="0.001" max="1.0" step="0.001" value="0.15">
            <label>D</label><input type="range" id="gDecay" min="0.01" max="1.0" step="0.01" value="0.2">
            <label>S</label><input type="range" id="gSustain" min="0" max="1" step="0.01" value="0.6">
            <label>R</label><input type="range" id="gRelease" min="0.01" max="1.5" step="0.01" value="0.8">
        </div>
    </div>

    <!-- LFO Controls -->
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px;">
        <div class="lfo-module">
            <span class="module-label">🌀 FILTER LFO</span>
            <div class="lfo-row">
                <label>rate</label><input type="range" id="filterLfoRate" min="0.1" max="12" step="0.1" value="1.2">
                <label>depth</label><input type="range" id="filterLfoDepth" min="0" max="300" step="1" value="80">
                <select id="filterLfoWave"><option value="sine">sine</option><option value="square">square</option><option value="sawtooth">sawtooth</option><option value="triangle" selected>triangle</option></select>
            </div>
        </div>
        <div class="lfo-module">
            <span class="module-label">🌀 GAIN LFO</span>
            <div class="lfo-row">
                <label>rate</label><input type="range" id="gainLfoRate" min="0.1" max="12" step="0.1" value="0.8">
                <label>depth</label><input type="range" id="gainLfoDepth" min="0" max="0.5" step="0.01" value="0.08">
                <select id="gainLfoWave"><option value="sine">sine</option><option value="square">square</option><option value="sawtooth">sawtooth</option><option value="triangle" selected>triangle</option></select>
            </div>
        </div>
        <div class="lfo-module">
            <span class="module-label">🌀 REVERB LFO</span>
            <div class="lfo-row">
                <label>rate</label><input type="range" id="reverbLfoRate" min="0.1" max="12" step="0.1" value="0.4">
                <label>depth</label><input type="range" id="reverbLfoDepth" min="0" max="0.3" step="0.01" value="0.05">
                <select id="reverbLfoWave"><option value="sine">sine</option><option value="square">square</option><option value="sawtooth">sawtooth</option><option value="triangle" selected>triangle</option></select>
            </div>
        </div>
    </div>

    <!-- Reverb + Master -->
    <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;">
        <div class="reverb-box">
            <span style="opacity:0.6; font-size:0.8rem;">⏳ REVERB</span>
            <label style="font-size:0.6rem;">wet</label><input type="range" id="reverbWet" min="0" max="1" step="0.01" value="0.45">
            <label style="font-size:0.6rem;">decay</label><input type="range" id="reverbDecay" min="0.1" max="3.0" step="0.1" value="2.0">
        </div>
        <div class="volume-control">
            <span style="opacity:0.6; font-size:0.8rem;">🔊</span>
            <input type="range" id="masterVolume" min="0" max="1" step="0.01" value="0.6">
        </div>
        <div style="display:flex; gap:8px;">
            <button id="panicBtn" style="background:#2a1a22; border-color:#4a2a3a;">🔇 PANIC</button>
        </div>
    </div>
</div>
<script>
    (function(){
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // ---------- MASTER ----------
        let masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.6;
        masterGain.connect(audioCtx.destination);

        // ---------- REVERB ----------
        let reverbNode = null;
        function createReverb(decay = 2.0, wet = 0.45) {
            if (reverbNode) {
                try { 
                    reverbNode.convolver.disconnect();
                    reverbNode.wetGain.disconnect();
                    reverbNode.dryGain.disconnect();
                } catch(e) {}
            }
            const convolver = audioCtx.createConvolver();
            const length = audioCtx.sampleRate * decay;
            const impulse = audioCtx.createBuffer(2, length, audioCtx.sampleRate);
            for (let channel = 0; channel < 2; channel++) {
                const data = impulse.getChannelData(channel);
                for (let i = 0; i < length; i++) {
                    const env = Math.exp(-i / (audioCtx.sampleRate * decay * 0.7));
                    data[i] = (Math.random() * 2 - 1) * env * 0.8;
                }
            }
            convolver.buffer = impulse;
            const wetGain = audioCtx.createGain();
            wetGain.gain.value = wet;
            const dryGain = audioCtx.createGain();
            dryGain.gain.value = 1 - wet;
            convolver.connect(wetGain);
            wetGain.connect(masterGain);
            dryGain.connect(masterGain);
            reverbNode = { convolver, wetGain, dryGain };
            return reverbNode;
        }
        let reverb = createReverb(2.0, 0.45);

        // DOM refs
        const $ = id => document.getElementById(id);
        const fAttack = $('fAttack'), fDecay = $('fDecay'), fSustain = $('fSustain'), fRelease = $('fRelease');
        const gAttack = $('gAttack'), gDecay = $('gDecay'), gSustain = $('gSustain'), gRelease = $('gRelease');
        const reverbWet = $('reverbWet'), reverbDecay = $('reverbDecay');
        const masterVol = $('masterVolume');
        const filterLfoRate = $('filterLfoRate'), filterLfoDepth = $('filterLfoDepth'), filterLfoWave = $('filterLfoWave');
        const gainLfoRate = $('gainLfoRate'), gainLfoDepth = $('gainLfoDepth'), gainLfoWave = $('gainLfoWave');
        const reverbLfoRate = $('reverbLfoRate'), reverbLfoDepth = $('reverbLfoDepth'), reverbLfoWave = $('reverbLfoWave');

        // ---------- FILTER ----------
        let filterNode = audioCtx.createBiquadFilter();
        filterNode.type = 'lowpass';
        filterNode.frequency.value = 1200;
        filterNode.Q.value = 0.8;

        let filterADSR = audioCtx.createGain();
        filterADSR.gain.value = 0.001;
        filterNode.connect(filterADSR);
        filterADSR.connect(reverb.convolver);

        let gainEnvelope = audioCtx.createGain();
        gainEnvelope.gain.value = 0.001;
        gainEnvelope.connect(filterNode);

        // ---------- OSCILLATORS (3) ----------
        const oscData = [];
        const oscContainer = $('oscContainer');

        function buildOscCard(index) {
            const card = document.createElement('div');
            card.className = 'osc-card';
            const waves = ['sine', 'square', 'sawtooth', 'triangle'];
            const defaultWave = index === 0 ? 'sawtooth' : index === 1 ? 'square' : 'triangle';
            card.innerHTML = `
                <h3>OSC ${index+1} <span class="lfo-badge">⚡ LFO</span></h3>
                <div class="control-row">
                    <label>wave</label>
                    <select class="oscWave">
                        ${waves.map(w => `<option value="${w}" ${w === defaultWave ? 'selected' : ''}>${w}</option>`).join('')}
                    </select>
                    <label>detune</label>
                    <input type="range" class="oscDetune" min="-50" max="50" step="0.5" value="${(index-1)*8}">
                </div>
                <div class="control-row">
                    <label>vol</label>
                    <input type="range" class="oscVolume" min="0" max="1" step="0.05" value="${0.25 + index*0.05}">
                    <label>LFO rate</label>
                    <input type="range" class="lfoRate" min="0.1" max="12" step="0.1" value="${2.0 + index*0.3}">
                    <label>depth</label>
                    <input type="range" class="lfoDepth" min="0" max="1" step="0.02" value="${0.15 + index*0.05}">
                </div>
            `;
            return card;
        }

        for (let i = 0; i < 3; i++) {
            const card = buildOscCard(i);
            oscContainer.appendChild(card);

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            gain.gain.value = 0.25 + i*0.05;
            osc.type = i === 0 ? 'sawtooth' : i === 1 ? 'square' : 'triangle';
            osc.frequency.value = 440;
            osc.detune.value = (i-1)*8;

            const lfoOsc = audioCtx.createOscillator();
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 0.15 + i*0.05;
            lfoOsc.frequency.value = 2.0 + i*0.3;
            lfoOsc.type = 'sine';

            lfoOsc.connect(lfoGain);
            lfoGain.connect(osc.frequency);

            const data = {
                osc, gain, lfoOsc, lfoGain,
                waveSelect: card.querySelector('.oscWave'),
                detuneRange: card.querySelector('.oscDetune'),
                oscVolume: card.querySelector('.oscVolume'),
                lfoRate: card.querySelector('.lfoRate'),
                lfoDepth: card.querySelector('.lfoDepth')
            };

            osc.connect(gain);
            gain.connect(gainEnvelope);
            osc.start();
            lfoOsc.start();

            data.waveSelect.addEventListener('change', () => { data.osc.type = data.waveSelect.value; });
            data.detuneRange.addEventListener('input', () => { data.osc.detune.value = parseFloat(data.detuneRange.value); });
            data.oscVolume.addEventListener('input', () => { data.gain.gain.value = parseFloat(data.oscVolume.value); });
            data.lfoRate.addEventListener('input', () => { data.lfoOsc.frequency.value = parseFloat(data.lfoRate.value); });
            data.lfoDepth.addEventListener('input', () => { data.lfoGain.gain.value = parseFloat(data.lfoDepth.value); });

            oscData.push(data);
        }

        // ---------- LFOs ----------
        const filterLfo = audioCtx.createOscillator();
        const filterLfoGain = audioCtx.createGain();
        filterLfoGain.gain.value = 80;
        filterLfo.frequency.value = 1.2;
        filterLfo.type = 'triangle';
        filterLfo.connect(filterLfoGain);
        filterLfoGain.connect(filterNode.frequency);
        filterLfo.start();

        const gainLfo = audioCtx.createOscillator();
        const gainLfoGain = audioCtx.createGain();
        gainLfoGain.gain.value = 0.08;
        gainLfo.frequency.value = 0.8;
        gainLfo.type = 'triangle';
        gainLfo.connect(gainLfoGain);
        gainLfoGain.connect(gainEnvelope.gain);
        gainLfo.start();

        const reverbLfo = audioCtx.createOscillator();
        const reverbLfoGain = audioCtx.createGain();
        reverbLfoGain.gain.value = 0.05;
        reverbLfo.frequency.value = 0.4;
        reverbLfo.type = 'triangle';
        reverbLfo.connect(reverbLfoGain);
        reverbLfoGain.connect(reverb.wetGain.gain);
        reverbLfo.start();

        // ---------- LFO UI ----------
        filterLfoRate.addEventListener('input', (e) => { filterLfo.frequency.value = parseFloat(e.target.value); });
        filterLfoDepth.addEventListener('input', (e) => { filterLfoGain.gain.value = parseFloat(e.target.value); });
        filterLfoWave.addEventListener('change', (e) => { filterLfo.type = e.target.value; });

        gainLfoRate.addEventListener('input', (e) => { gainLfo.frequency.value = parseFloat(e.target.value); });
        gainLfoDepth.addEventListener('input', (e) => { gainLfoGain.gain.value = parseFloat(e.target.value); });
        gainLfoWave.addEventListener('change', (e) => { gainLfo.type = e.target.value; });

        reverbLfoRate.addEventListener('input', (e) => { reverbLfo.frequency.value = parseFloat(e.target.value); });
        reverbLfoDepth.addEventListener('input', (e) => { reverbLfoGain.gain.value = parseFloat(e.target.value); });
        reverbLfoWave.addEventListener('change', (e) => { reverbLfo.type = e.target.value; });

        // ---------- Reverb UI ----------
        reverbWet.addEventListener('input', (e) => {
            if (reverb) {
                reverb.wetGain.gain.value = parseFloat(e.target.value);
                reverb.dryGain.gain.value = 1 - parseFloat(e.target.value);
            }
        });
        reverbDecay.addEventListener('input', (e) => {
            const decay = parseFloat(e.target.value);
            const wet = parseFloat(reverbWet.value);
            const newReverb = createReverb(decay, wet);
            if (filterADSR) {
                filterADSR.disconnect();
                filterADSR.connect(newReverb.convolver);
            }
            reverb = newReverb;
            reverbLfoGain.disconnect();
            reverbLfoGain.connect(reverb.wetGain.gain);
        });

        masterVol.addEventListener('input', (e) => {
            masterGain.gain.value = parseFloat(e.target.value);
        });

        // ---------- NOTE MANAGEMENT ----------
        let activeNotes = new Map();

        function triggerNote(frequency, velocity = 0.7) {
            if (activeNotes.has(frequency)) return;
            
            const now = audioCtx.currentTime;
            const fA = parseFloat(fAttack.value);
            const fD = parseFloat(fDecay.value);
            const fS = parseFloat(fSustain.value);
            const fR = parseFloat(fRelease.value);
            const gA = parseFloat(gAttack.value);
            const gD = parseFloat(gDecay.value);
            const gS = parseFloat(gSustain.value);
            const gR = parseFloat(gRelease.value);

            const noteGain = audioCtx.createGain();
            noteGain.gain.value = 0.001;
            noteGain.connect(filterNode);

            const noteFilter = audioCtx.createBiquadFilter();
            noteFilter.type = 'lowpass';
            noteFilter.frequency.value = 1200;
            noteFilter.Q.value = 0.8;
            noteGain.connect(noteFilter);

            const noteFilterEnv = audioCtx.createGain();
            noteFilterEnv.gain.value = 0.001;
            noteFilter.connect(noteFilterEnv);
            noteFilterEnv.connect(reverb.convolver);

            const freqMod = audioCtx.createGain();
            freqMod.gain.value = 60;
            freqMod.connect(noteFilter.frequency);

            oscData.forEach(d => {
                d.gain.disconnect();
                d.gain.connect(noteGain);
                d.osc.frequency.value = frequency;
            });

            const gParam = noteGain.gain;
            gParam.cancelScheduledValues(now);
            gParam.setValueAtTime(0.001, now);
            gParam.linearRampToValueAtTime(velocity * 0.6, now + gA);
            gParam.linearRampToValueAtTime(gS * velocity * 0.6, now + gA + gD);

            const fParam = noteFilterEnv.gain;
            fParam.cancelScheduledValues(now);
            fParam.setValueAtTime(0.001, now);
            fParam.linearRampToValueAtTime(1.0, now + fA);
            fParam.linearRampToValueAtTime(fS * 1.0, now + fA + fD);

            const freqParam = freqMod.gain;
            freqParam.cancelScheduledValues(now);
            freqParam.setValueAtTime(60, now);
            freqParam.linearRampToValueAtTime(1200, now + fA);
            freqParam.linearRampToValueAtTime(400 + fS * 800, now + fA + fD);

            activeNotes.set(frequency, { noteGain, noteFilter, noteFilterEnv, freqMod, gParam, fParam, freqParam, gR, fR });
        }

        function releaseNote(frequency) {
            const note = activeNotes.get(frequency);
            if (!note) return;

            const now = audioCtx.currentTime;
            const { noteGain, noteFilterEnv, freqParam, gR, fR, gParam, fParam } = note;

            gParam.cancelScheduledValues(now);
            gParam.setValueAtTime(gParam.value, now);
            gParam.linearRampToValueAtTime(0.001, now + gR);

            fParam.cancelScheduledValues(now);
            fParam.setValueAtTime(fParam.value, now);
            fParam.linearRampToValueAtTime(0.001, now + fR);

            freqParam.cancelScheduledValues(now);
            freqParam.setValueAtTime(freqParam.value, now);
            freqParam.linearRampToValueAtTime(60, now + fR);

            setTimeout(() => {
                try {
                    noteGain.disconnect();
                    noteFilter.disconnect();
                    noteFilterEnv.disconnect();
                    freqMod.disconnect();
                    oscData.forEach(d => {
                        d.gain.disconnect();
                        d.gain.connect(gainEnvelope);
                    });
                } catch(e) {}
            }, (Math.max(gR, fR) * 1000) + 100);

            activeNotes.delete(frequency);
        }

        function panic() {
            activeNotes.forEach((_, freq) => releaseNote(freq));
        }
        $('panicBtn').addEventListener('click', panic);

        // ---------- KEYBOARD ----------
        const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
        const baseFreq = 261.63;
        const keyboardEl = $('keyboard');

        for (let octave = 3; octave <= 6; octave++) {
            for (let i = 0; i < 12; i++) {
                const freq = baseFreq * Math.pow(2, (octave - 4) + (i / 12));
                const isBlack = notes[i].includes('#');
                const key = document.createElement('div');
                key.className = `key${isBlack ? ' black' : ''}`;
                key.dataset.freq = freq;
                key.textContent = notes[i] + octave;
                
                key.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    key.classList.add('active');
                    triggerNote(parseFloat(key.dataset.freq), 0.7);
                    if (isRecording) {
                        recordedNotes.push({ freq: parseFloat(key.dataset.freq), time: performance.now() - recordStart });
                    }
                });
                key.addEventListener('mouseup', (e) => {
                    e.preventDefault();
                    key.classList.remove('active');
                    releaseNote(parseFloat(key.dataset.freq));
                });
                key.addEventListener('mouseleave', () => {
                    key.classList.remove('active');
                    releaseNote(parseFloat(key.dataset.freq));
                });
                key.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    key.classList.add('active');
                    triggerNote(parseFloat(key.dataset.freq), 0.7);
                    if (isRecording) {
                        recordedNotes.push({ freq: parseFloat(key.dataset.freq), time: performance.now() - recordStart });
                    }
                });
                key.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    key.classList.remove('active');
                    releaseNote(parseFloat(key.dataset.freq));
                });
                keyboardEl.appendChild(key);
            }
        }

        // ---------- RECORDING & PLAYBACK ----------
        let isRecording = false;
        let recordedNotes = [];
        let recordStart = 0;
        let isPlaying = false;
        const melodyDisplay = $('melodyDisplay');

        $('recordBtn').addEventListener('click', function() {
            if (isRecording) {
                isRecording = false;
                this.classList.remove('active');
                this.textContent = '⏺ RECORD';
                melodyDisplay.textContent = `📜 recorded ${recordedNotes.length} notes... press PLAY to hear`;
            } else {
                recordedNotes = [];
                isRecording = true;
                recordStart = performance.now();
                this.classList.add('active');
                this.textContent = '⏹ STOP';
                melodyDisplay.textContent = '🔮 recording ancient melody...';
            }
        });

        $('clearMelodyBtn').addEventListener('click', () => {
            recordedNotes = [];
            melodyDisplay.textContent = '🗑️ melody forgotten';
            if (isPlaying) {
                isPlaying = false;
                $('playMelodyBtn').textContent = '▶ PLAY MELODY';
            }
        });

        $('playMelodyBtn').addEventListener('click', function() {
            if (isPlaying) {
                isPlaying = false;
                this.textContent = '▶ PLAY MELODY';
                return;
            }
            if (recordedNotes.length === 0) {
                melodyDisplay.textContent = '⚠️ no melody recorded! click RECORD and play';
                return;
            }

            isPlaying = true;
            this.textContent = '⏹ STOP';
            melodyDisplay.textContent = `🎵 playing ${recordedNotes.length} notes...`;

            const tempo = parseInt($('tempo').value);
            const beatDuration = 60 / tempo;
            let index = 0;
            const startTime = audioCtx.currentTime;
            const firstNoteTime = recordedNotes[0]?.time || 0;

            function scheduleNext() {
                if (!isPlaying || index >= recordedNotes.length) {
                    isPlaying = false;
                    $('playMelodyBtn').textContent = '▶ PLAY MELODY';
                    melodyDisplay.textContent = `✨ ${recordedNotes.length} notes played`;
                    return;
                }

                const note = recordedNotes[index];
                const time = startTime + (note.time - firstNoteTime) / 1000;
                const duration = index < recordedNotes.length - 1 
                    ? (recordedNotes[index + 1].time - note.time) / 1000 
                    : beatDuration * 0.6;

                const scheduledTime = audioCtx.currentTime + Math.max(0, time - audioCtx.currentTime);
                const freq = note.freq;

                const now = audioCtx.currentTime;
                const fA = parseFloat(fAttack.value);
                const fD = parseFloat(fDecay.value);
                const fS = parseFloat(fSustain.value);
                const fR = parseFloat(fRelease.value);
                const gA = parseFloat(gAttack.value);
                const gD = parseFloat(gDecay.value);
                const gS = parseFloat(gSustain.value);
                const gR = parseFloat(gRelease.value);

                const noteGain = audioCtx.createGain();
                noteGain.gain.setValueAtTime(0.001, scheduledTime);
                noteGain.connect(filterNode);

                const noteFilter = audioCtx.createBiquadFilter();
                noteFilter.type = 'lowpass';
                noteFilter.frequency.setValueAtTime(1200, scheduledTime);
                noteFilter.Q.value = 0.8;
                noteGain.connect(noteFilter);

                const noteFilterEnv = audioCtx.createGain();
                noteFilterEnv.gain.setValueAtTime(0.001, scheduledTime);
                noteFilter.connect(noteFilterEnv);
                noteFilterEnv.connect(reverb.convolver);

                const freqMod = audioCtx.createGain();
                freqMod.gain.setValueAtTime(60, scheduledTime);
                freqMod.connect(noteFilter.frequency);

                oscData.forEach(d => {
                    d.gain.disconnect();
                    d.gain.connect(noteGain);
                    d.osc.frequency.setValueAtTime(freq, scheduledTime);
                });

                const gParam = noteGain.gain;
                gParam.linearRampToValueAtTime(0.5, scheduledTime + gA);
                gParam.linearRampToValueAtTime(gS * 0.5, scheduledTime + gA + gD);

                const fParam = noteFilterEnv.gain;
                fParam.linearRampToValueAtTime(1.0, scheduledTime + fA);
                fParam.linearRampToValueAtTime(fS * 1.0, scheduledTime + fA + fD);

                const freqParam = freqMod.gain;
                freqParam.linearRampToValueAtTime(1200, scheduledTime + fA);
                freqParam.linearRampToValueAtTime(400 + fS * 800, scheduledTime + fA + fD);

                const releaseTime = scheduledTime + Math.max(duration, 0.05);
                setTimeout(() => {
                    const now2 = audioCtx.currentTime;
                    gParam.cancelScheduledValues(now2);
                    gParam.setValueAtTime(gParam.value, now2);
                    gParam.linearRampToValueAtTime(0.001, now2 + gR);

                    fParam.cancelScheduledValues(now2);
                    fParam.setValueAtTime(fParam.value, now2);
                    fParam.linearRampToValueAtTime(0.001, now2 + fR);

                    freqParam.cancelScheduledValues(now2);
                    freqParam.setValueAtTime(freqParam.value, now2);
                    freqParam.linearRampToValueAtTime(60, now2 + fR);

                    setTimeout(() => {
                        try {
                            noteGain.disconnect();
                            noteFilter.disconnect();
                            noteFilterEnv.disconnect();
                            freqMod.disconnect();
                            oscData.forEach(d => {
                                d.gain.disconnect();
                                d.gain.connect(gainEnvelope);
                            });
                        } catch(e) {}
                    }, (Math.max(gR, fR) * 1000) + 100);
                }, (releaseTime - audioCtx.currentTime) * 1000);

                index++;
                const nextDelay = index < recordedNotes.length 
                    ? Math.max(0, (recordedNotes[index].time - note.time) / 1000)
                    : 0.1;
                setTimeout(scheduleNext, nextDelay * 1000 + 50);
            }

            setTimeout(scheduleNext, 100);
        });

        $('tempo').addEventListener('input', (e) => {
            $('tempoLabel').textContent = e.target.value;
        });

        // ---------- PRESETS ----------
        function applyPreset(name) {
            // Reset all active notes
            panic();
            
            // Default dungeon synth settings
            let settings = {
                fAttack: 0.15, fDecay: 0.3, fSustain: 0.3, fRelease: 0.6,
                gAttack: 0.15, gDecay: 0.2, gSustain: 0.6, gRelease: 0.8,
                reverbWet: 0.45, reverbDecay: 2.0,
                filterLfoRate: 1.2, filterLfoDepth: 80, filterLfoWave: 'triangle',
                gainLfoRate: 0.8, gainLfoDepth: 0.08, gainLfoWave: 'triangle',
                reverbLfoRate: 0.4, reverbLfoDepth: 0.05, reverbLfoWave: 'triangle',
                masterVol: 0.6,
                osc1Wave: 'sawtooth', osc2Wave: 'square', osc3Wave: 'triangle',
                osc1Vol: 0.3, osc2Vol: 0.35, osc3Vol: 0.4,
                osc1Detune: -8, osc2Detune: 0, osc3Detune: 8,
                osc1LfoRate: 2.0, osc2LfoRate: 2.3, osc3LfoRate: 2.6,
                osc1LfoDepth: 0.15, osc2LfoDepth: 0.2, osc3LfoDepth: 0.25,
                filterFreq: 1200, filterQ: 0.8
            };

            if (name === 'cathedral') {
                settings = {
                    fAttack: 0.3, fDecay: 0.5, fSustain: 0.4, fRelease: 1.0,
                    gAttack: 0.3, gDecay: 0.3, gSustain: 0.7, gRelease: 1.2,
                    reverbWet: 0.6, reverbDecay: 2.8,
                    filterLfoRate: 0.6, filterLfoDepth: 50, filterLfoWave: 'sine',
                    gainLfoRate: 0.3, gainLfoDepth: 0.05, gainLfoWave: 'sine',
                    reverbLfoRate: 0.2, reverbLfoDepth: 0.03, reverbLfoWave: 'sine',
                    masterVol: 0.65,
                    osc1Wave: 'sine', osc2Wave: 'sine', osc3Wave: 'triangle',
                    osc1Vol: 0.4, osc2Vol: 0.35, osc3Vol: 0.3,
                    osc1Detune: -12, osc2Detune: 0, osc3Detune: 12,
                    osc1LfoRate: 1.0, osc2LfoRate: 1.3, osc3LfoRate: 1.6,
                    osc1LfoDepth: 0.1, osc2LfoDepth: 0.15, osc3LfoDepth: 0.2,
                    filterFreq: 800, filterQ: 0.6
                };
            } else if (name === 'goblin') {
                settings = {
                    fAttack: 0.02, fDecay: 0.1, fSustain: 0.2, fRelease: 0.2,
                    gAttack: 0.01, gDecay: 0.08, gSustain: 0.4, gRelease: 0.15,
                    reverbWet: 0.2, reverbDecay: 0.8,
                    filterLfoRate: 4.0, filterLfoDepth: 150, filterLfoWave: 'square',
                    gainLfoRate: 3.0, gainLfoDepth: 0.2, gainLfoWave: 'square',
                    reverbLfoRate: 1.5, reverbLfoDepth: 0.1, reverbLfoWave: 'square',
                    masterVol: 0.5,
                    osc1Wave: 'square', osc2Wave: 'sawtooth', osc3Wave: 'square',
                    osc1Vol: 0.25, osc2Vol: 0.2, osc3Vol: 0.15,
                    osc1Detune: -24, osc2Detune: 0, osc3Detune: 24,
                    osc1LfoRate: 5.0, osc2LfoRate: 4.5, osc3LfoRate: 5.5,
                    osc1LfoDepth: 0.4, osc2LfoDepth: 0.3, osc3LfoDepth: 0.35,
                    filterFreq: 800, filterQ: 1.5
                };
            }

            // Apply all settings
            fAttack.value = settings.fAttack;
            fDecay.value = settings.fDecay;
            fSustain.value = settings.fSustain;
            fRelease.value = settings.fRelease;
            gAttack.value = settings.gAttack;
            gDecay.value = settings.gDecay;
            gSustain.value = settings.gSustain;
            gRelease.value = settings.gRelease;
            reverbWet.value = settings.reverbWet;
            reverbDecay.value = settings.reverbDecay;
            filterLfoRate.value = settings.filterLfoRate;
            filterLfoDepth.value = settings.filterLfoDepth;
            filterLfoWave.value = settings.filterLfoWave;
            gainLfoRate.value = settings.gainLfoRate;
            gainLfoDepth.value = settings.gainLfoDepth;
            gainLfoWave.value = settings.gainLfoWave;
            reverbLfoRate.value = settings.reverbLfoRate;
            reverbLfoDepth.value = settings.reverbLfoDepth;
            reverbLfoWave.value = settings.reverbLfoWave;
            masterVol.value = settings.masterVol;

            // Apply LFOs
            filterLfo.frequency.value = settings.filterLfoRate;
            filterLfoGain.gain.value = settings.filterLfoDepth;
            filterLfo.type = settings.filterLfoWave;
            gainLfo.frequency.value = settings.gainLfoRate;
            gainLfoGain.gain.value = settings.gainLfoDepth;
            gainLfo.type = settings.gainLfoWave;
            reverbLfo.frequency.value = settings.reverbLfoRate;
            reverbLfoGain.gain.value = settings.reverbLfoDepth;
            reverbLfo.type = settings.reverbLfoWave;

            // Apply oscillators
            const oscWaves = [settings.osc1Wave, settings.osc2Wave, settings.osc3Wave];
            const oscVols = [settings.osc1Vol, settings.osc2Vol, settings.osc3Vol];
            const oscDetunes = [settings.osc1Detune, settings.osc2Detune, settings.osc3Detune];
            const oscLfoRates = [settings.osc1LfoRate, settings.osc2LfoRate, settings.osc3LfoRate];
            const oscLfoDepths = [settings.osc1LfoDepth, settings.osc2LfoDepth, settings.osc3LfoDepth];

            oscData.forEach((d, i) => {
                d.waveSelect.value = oscWaves[i];
                d.osc.type = oscWaves[i];
                d.oscVolume.value = oscVols[i];
                d.gain.gain.value = oscVols[i];
                d.detuneRange.value = oscDetunes[i];
                d.osc.detune.value = oscDetunes[i];
                d.lfoRate.value = oscLfoRates[i];
                d.lfoOsc.frequency.value = oscLfoRates[i];
                d.lfoDepth.value = oscLfoDepths[i];
                d.lfoGain.gain.value = oscLfoDepths[i];
            });

            // Apply filter
            filterNode.frequency.value = settings.filterFreq;
            filterNode.Q.value = settings.filterQ;

            // Apply reverb
            const newReverb = createReverb(settings.reverbDecay, settings.reverbWet);
            if (filterADSR) {
                filterADSR.disconnect();
                filterADSR.connect(newReverb.convolver);
            }
            reverb = newReverb;
            reverbLfoGain.disconnect();
            reverbLfoGain.connect(reverb.wetGain.gain);

            // Master volume
            masterGain.gain.value = settings.masterVol;

            melodyDisplay.textContent = `🏰 ${name.toUpperCase()} preset loaded`;
            
            // Update active preset button
            document.querySelectorAll('.preset-bar button').forEach(b => b.classList.remove('active'));
            document.querySelector(`#${name}Preset`)?.classList.add('active');
        }

        $('dungeonPreset').addEventListener('click', () => applyPreset('dungeon'));
        $('cathedralPreset').addEventListener('click', () => applyPreset('cathedral'));
        $('goblinPreset').addEventListener('click', () => applyPreset('goblin'));
        $('resetPreset').addEventListener('click', () => applyPreset('dungeon'));

        // Load dungeon preset on startup
        setTimeout(() => applyPreset('dungeon'), 100);

        window.addEventListener('beforeunload', () => {
            try { audioCtx.close(); } catch(e) {}
        });
    })();
</script>
</body>
</html>
