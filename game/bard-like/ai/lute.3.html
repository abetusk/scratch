<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chiptune Lute · Tone.js</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #1a1e2a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    .card {
      background: #2a2f3f;
      padding: 2rem 2.5rem;
      border-radius: 2.5rem;
      box-shadow: 0 15px 30px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.08);

      max-width: 720px;

      gap: 1.5rem;

      letter-spacing: 2px;

    .lute-key[data-note="F4"] { border-left-color: #e88f7a; }
    .lute-key[data-note="G4"] { border-left-color: #d9837a; }
    .lute-key[data-note="A4"] { border-left-color: #c97a7a; }
    .lute-key[data-note="B4"] { border-left-color: #b8737a; }
    .lute-key[data-note="C5"] { border-left-color: #a86d7a; }

      align-items: center;
      gap: 0.4rem;
      background: #232836;
      padding: 0.2rem 0.6rem 0.2rem 0.8rem;
      border-radius: 3rem;
      box-shadow: inset 0 2px 6px #0e121b;
    }
    .control-group label {
      color: #b3c5e6;
      font-size: 0.65rem;
      letter-spacing: 0.5px;
      font-weight: 300;
    }
    .control-group input[type="range"] {
      width: 60px;
      height: 3px;
      -webkit-appearance: none;
      appearance: none;
      background: #4d5773;
      border-radius: 10px;
      outline: none;
    }
    .control-group input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #b7cef0;
      cursor: pointer;
      box-shadow: 0 2px 6px #0a0e17;
      border: 1px solid #d3e2ff;

    .value-badge {
      min-width: 24px;

      width: 13px;
      height: 13px;
      cursor: pointer;
    }

<body>
<div class="card">
  <div class="gui">
    <div class="title">🎸 · CHIPTUNE LUTE · enhanced</div>

    <!-- KEYBOARD -->
    <div class="keyboard" id="keyboardContainer"></div>

    <!-- CONTROLS -->
    <div class="controls">
      <div class="control-group">
        <label>decay</label>
        <input type="range" id="decaySlider" min="0.05" max="1.5" step="0.01" value="0.5">
        <span class="value-badge" id="decayValue">0.50</span>
      </div>
      <div class="control-group">
        <label>gain</label>
        <input type="range" id="gainSlider" min="0.05" max="0.9" step="0.01" value="0.5">
        <span class="value-badge" id="gainValue">0.50</span>
      </div>
      <div class="control-group">
        <label>detune</label>
        <input type="range" id="detuneSlider" min="0" max="20" step="1" value="8">
        <span class="value-badge" id="detuneValue">8</span>
      </div>
      <div class="control-group">
        <label>BPM</label>
        <input type="range" id="bpmSlider" min="60" max="200" step="1" value="120">
        <span class="value-badge" id="bpmValue">120</span>
      </div>
    </div>

    <!-- EFFECTS TOGGLE -->
    <div class="effect-toggle">
      <label>
        <input type="checkbox" id="chorusToggle" checked> Chorus
      </label>
      <label>
        <input type="checkbox" id="reverbToggle" checked> Reverb
      </label>
    </div>

    <!-- MELODY CONTROLS -->
    <div class="melody-controls">
      <button class="melody-btn play" id="playMelodyBtn">▶ Play Melody</button>
      <button class="melody-btn stop" id="stopMelodyBtn" disabled>■ Stop</button>
    </div>

    <div class="standalone-badge">⚡ instrument standalone · GUI separate</div>
    <div class="footer">dual oscillator · chorus · reverb · chiptune warmth</div>
  </div>
</div>

<!--  TONE.JS LIBRARY                                              -->
<!-- ============================================================ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>

<script>
  (function() {
    "use strict";

    // --------------------------------------------------------------
    // 1. ENHANCED INSTRUMENT MODULE (fixed detune)
    // --------------------------------------------------------------
    class ChiptuneLute {
      constructor(params = {}) {
        // --- Create effects chain ---
        this.gainNode = new Tone.Gain(params.gain ?? 0.5);

        // Chorus effect
        this.chorus = new Tone.Chorus({
          frequency: 1.5,
          delayTime: 6,
          depth: 0.7,
          type: 'sine',
          spread: 180
        });

        // Reverb
        this.reverb = new Tone.Reverb({
          decay: 1.2,
          preDelay: 0.02,
          wet: 0.25
        });

        // Effects routing
        this.effectsBypass = new Tone.Gain(1);
        this.effectsBypass.connect(this.chorus);
        this.chorus.connect(this.reverb);
        this.reverb.connect(Tone.Destination);

        this.dryPath = new Tone.Gain(0);
        this.dryPath.connect(Tone.Destination);

        // --- Main synth with filter envelope ---
        this.synth = new Tone.MonoSynth({
          oscillator: {
            type: 'square8'
          },
          filter: {
            type: 'lowpass',
            frequency: 1800,
            rolloff: -12
          },
          filterEnvelope: {
            attack: 0.001,
            decay: 0.2,
            sustain: 0.3,
            release: 0.1,
            baseFrequency: 800,
            octaves: 2.5
          },
          envelope: {
            attack: 0.001,
            decay: params.decay ?? 0.5,
            sustain: 0.0,
            release: 0.08
          },
          volume: -12
        });

        // --- Second synth (detuned) ---
        this.synth2 = new Tone.MonoSynth({
          oscillator: {
            type: 'square4'
          },
          filter: {
            type: 'lowpass',
            frequency: 1600,
            rolloff: -12
          },
          filterEnvelope: {
            attack: 0.001,
            decay: 0.2,
            sustain: 0.3,
            release: 0.1,
            baseFrequency: 700,
            octaves: 2.5
          },
          envelope: {
            attack: 0.001,
            decay: params.decay ?? 0.5,
            sustain: 0.0,
            release: 0.08
          },
          volume: -14
        });

        // Connect both synths through gain
        this.synth.connect(this.gainNode);
        this.synth2.connect(this.gainNode);
        this.gainNode.connect(this.effectsBypass);
        this.gainNode.connect(this.dryPath);

        // Store params
        this._decay = params.decay ?? 0.5;
        this._gain = params.gain ?? 0.5;
        this._detuneAmount = params.detune ?? 8;
        this._effectsEnabled = true;

        // Store oscillator references for detune
        this._osc1 = this.synth.oscillator;
        this._osc2 = this.synth2.oscillator;

        // Set initial detune using set() method
        this.setDetune(this._detuneAmount);

        // Melody state
        this._melodyEvents = [];
        this._isMelodyPlaying = false;
        this._melodyCallback = null;
      }

      /** Play a single note */
      playNote(note, decayTime = this._decay, gainValue = this._gain, detune = this._detuneAmount) {
        if (!Tone.context.state || Tone.context.state === 'suspended') {
          Tone.context.resume();
        }

        // Update params
        if (decayTime !== this._decay) {
          this.setDecay(decayTime);
        }
        if (gainValue !== this._gain) {
          this.setGain(gainValue);
        }
        if (detune !== this._detuneAmount) {
          this.setDetune(detune);
        }

        // Add subtle random variation to each note (using set() method)
        const detuneCents1 = Math.random() * 4 - 2;
        const detuneCents2 = this._detuneAmount + (Math.random() * 4 - 2);
        
        this._osc1.set({ detune: detuneCents1 });
        this._osc2.set({ detune: detuneCents2 });

        // Trigger both synths with slight offset
        const now = Tone.now();
        this.synth.triggerAttackRelease(note, '8n', now);
        this.synth2.triggerAttackRelease(note, '8n', now + 0.005);
      }

      /** Set decay time */
      setDecay(time) {
        this._decay = Math.min(1.5, Math.max(0.02, time));
        this.synth.envelope.decay = this._decay;
        this.synth2.envelope.decay = this._decay;
      }

      /** Set gain */
      setGain(val) {
        this._gain = Math.min(0.9, Math.max(0.05, val));
        this.gainNode.gain.value = this._gain;
      }

      /** Set detune amount (cents between the two oscillators) */
      setDetune(amount) {
        this._detuneAmount = Math.min(20, Math.max(0, amount));
        // Apply detune to oscillator 2 (oscillator 1 stays at 0)
        this._osc2.set({ detune: this._detuneAmount });
      }

      /** Enable/disable effects */
      setEffectsEnabled(enabled) {
        this._effectsEnabled = enabled;
        if (enabled) {
          this.effectsBypass.gain.value = 1;
          this.dryPath.gain.value = 0;
        } else {
          this.effectsBypass.gain.value = 0;
          this.dryPath.gain.value = 1;
        }
      }

      /** Play melody using Tone.Transport */
      playMelody(melodyData, bpm = 120, callback = null) {
        this.stopMelody();

        if (!melodyData || melodyData.length === 0) {
          return { stop: () => {} };
        }

        if (Tone.context.state === 'suspended') {
          Tone.context.resume();
        }

        Tone.Transport.bpm.value = bpm;
        this._melodyCallback = callback;
        this._isMelodyPlaying = true;

        let totalBeats = 0;
        const events = [];

        melodyData.forEach((item) => {
          const note = item.note;
          const duration = item.duration || 0.5;

          const event = Tone.Transport.schedule((time) => {
            if (!this._isMelodyPlaying) return;

            // Random detune variation per note using set()
            const detune1 = Math.random() * 4 - 2;
            const detune2 = this._detuneAmount + (Math.random() * 4 - 2);
            this._osc1.set({ detune: detune1 });
            this._osc2.set({ detune: detune2 });

            // Trigger with slight offset
            this.synth.triggerAttackRelease(note, duration * 0.85, time);
            this.synth2.triggerAttackRelease(note, duration * 0.85, time + 0.005);
          }, totalBeats);

          events.push(event);
          totalBeats += duration;
        });

        this._melodyEvents = events;

        // Cleanup
        const cleanupEvent = Tone.Transport.schedule(() => {
          this._isMelodyPlaying = false;
          if (this._melodyCallback) {
            this._melodyCallback();
            this._melodyCallback = null;
          }
        }, totalBeats);

        this._melodyEvents.push(cleanupEvent);

        if (Tone.Transport.state === 'stopped') {
          Tone.Transport.start();
        }

        return { stop: () => this.stopMelody() };
      }

      /** Stop melody */
      stopMelody() {
        this._melodyEvents.forEach(event => {
          if (event && event.id !== undefined) {
            Tone.Transport.clear(event.id);
          }
        });
        this._melodyEvents = [];
        this._isMelodyPlaying = false;
        this._melodyCallback = null;
      }

      isMelodyPlaying() {
        return this._isMelodyPlaying;
      }

      /** Dispose */
      dispose() {
        this.stopMelody();
        this.synth.dispose();
        this.synth2.dispose();
        this.gainNode.dispose();
        this.chorus.dispose();
        this.reverb.dispose();
        this.effectsBypass.dispose();
        this.dryPath.dispose();
      }
    }

    // --------------------------------------------------------------
    // 2. GUI CONTROLLER
    // --------------------------------------------------------------
    class LuteGUI {
      constructor(instrument) {
        this.instrument = instrument;

        // DOM elements
        this.keyboardEl = document.getElementById('keyboardContainer');
        this.decaySlider = document.getElementById('decaySlider');
        this.decayValue = document.getElementById('decayValue');
        this.gainSlider = document.getElementById('gainSlider');
        this.gainValue = document.getElementById('gainValue');
        this.detuneSlider = document.getElementById('detuneSlider');
        this.detuneValue = document.getElementById('detuneValue');
        this.bpmSlider = document.getElementById('bpmSlider');
        this.bpmValue = document.getElementById('bpmValue');
        this.playMelodyBtn = document.getElementById('playMelodyBtn');
        this.stopMelodyBtn = document.getElementById('stopMelodyBtn');
        this.chorusToggle = document.getElementById('chorusToggle');
        this.reverbToggle = document.getElementById('reverbToggle');

        // Notes
        this.notes = ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5', 'D5', 'E5'];

        // Melody with more interesting pattern
        this.defaultMelody = [
          { note: 'C4', duration: 0.5 }, { note: 'C4', duration: 0.5 },
          { note: 'G4', duration: 0.5 }, { note: 'G4', duration: 0.5 },
          { note: 'A4', duration: 0.5 }, { note: 'A4', duration: 0.5 },
          { note: 'G4', duration: 0.75 },
          { note: 'F4', duration: 0.5 }, { note: 'F4', duration: 0.5 },
          { note: 'E4', duration: 0.5 }, { note: 'E4', duration: 0.5 },
          { note: 'D4', duration: 0.5 }, { note: 'D4', duration: 0.5 },
          { note: 'C4', duration: 0.75 },
          // Turnaround
          { note: 'G4', duration: 0.5 }, { note: 'G4', duration: 0.5 },
          { note: 'C5', duration: 0.5 }, { note: 'C5', duration: 0.5 },
          { note: 'B4', duration: 0.5 }, { note: 'B4', duration: 0.5 },
          { note: 'A4', duration: 0.75 },
          { note: 'G4', duration: 0.5 }, { note: 'G4', duration: 0.5 },
          { note: 'F4', duration: 0.5 }, { note: 'F4', duration: 0.5 },
          { note: 'E4', duration: 0.5 }, { note: 'E4', duration: 0.5 },
          { note: 'C4', duration: 0.75 },
        ];
        
        const furElise = [
                // Bar 1-2: Main theme
                { note: 'E5', duration: 0.25 }, { note: 'D#5', duration: 0.25 },
                { note: 'E5', duration: 0.25 }, { note: 'D#5', duration: 0.25 },
                { note: 'E5', duration: 0.25 }, { note: 'B4', duration: 0.25 },
                { note: 'D5', duration: 0.25 }, { note: 'C5', duration: 0.25 },
                
                // Bar 3-4
                { note: 'A4', duration: 0.25 }, { note: 'C4', duration: 0.25 },
                { note: 'E4', duration: 0.25 }, { note: 'A4', duration: 0.25 },
                { note: 'B4', duration: 0.25 }, { note: 'E4', duration: 0.25 },
                { note: 'G#4', duration: 0.25 }, { note: 'B4', duration: 0.25 },
                
                // Bar 5-6
                { note: 'C5', duration: 0.25 }, { note: 'E4', duration: 0.25 },
                { note: 'A4', duration: 0.25 }, { note: 'C5', duration: 0.25 },
                { note: 'B4', duration: 0.25 }, { note: 'E4', duration: 0.25 },
                { note: 'G#4', duration: 0.25 }, { note: 'B4', duration: 0.25 },
                
                // Bar 7-8
                { note: 'C5', duration: 0.25 }, { note: 'E4', duration: 0.25 },
                { note: 'A4', duration: 0.25 }, { note: 'C5', duration: 0.25 },
                { note: 'B4', duration: 0.25 }, { note: 'D4', duration: 0.25 },
                { note: 'G4', duration: 0.25 }, { note: 'B4', duration: 0.25 },
                
                // Bar 9-10
                { note: 'C5', duration: 0.25 }, { note: 'D4', duration: 0.25 },
                { note: 'G4', duration: 0.25 }, { note: 'B4', duration: 0.25 },
                { note: 'C5', duration: 0.25 }, { note: 'E4', duration: 0.25 },
                { note: 'A4', duration: 0.25 }, { note: 'C5', duration: 0.25 },
                
                // Bar 11-12
                { note: 'B4', duration: 0.25 }, { note: 'D4', duration: 0.25 },
                { note: 'G4', duration: 0.25 }, { note: 'B4', duration: 0.25 },
                { note: 'C5', duration: 0.25 }, { note: 'E4', duration: 0.25 },
                { note: 'A4', duration: 0.25 }, { note: 'C5', duration: 0.25 },
                
                // Bar 13-14
                { note: 'B4', duration: 0.25 }, { note: 'F4', duration: 0.25 },
                { note: 'B4', duration: 0.25 }, { note: 'D5', duration: 0.25 },
                { note: 'C5', duration: 0.25 }, { note: 'E4', duration: 0.25 },
                { note: 'A4', duration: 0.25 }, { note: 'C5', duration: 0.25 },
                
                // Bar 15-16
                { note: 'B4', duration: 0.25 }, { note: 'E4', duration: 0.25 },
                { note: 'A4', duration: 0.25 }, { note: 'C5', duration: 0.25 },
                { note: 'B4', duration: 0.25 }, { note: 'E4', duration: 0.25 },
                { note: 'G#4', duration: 0.25 }, { note: 'B4', duration: 0.25 },
                
                // Bar 17-18
                { note: 'C5', duration: 0.25 }, { note: 'E4', duration: 0.25 },
                { note: 'A4', duration: 0.25 }, { note: 'C5', duration: 0.25 },
                { note: 'B4', duration: 0.25 }, { note: 'D4', duration: 0.25 },
                { note: 'G4', duration: 0.25 }, { note: 'B4', duration: 0.25 },
                
                // Bar 19-20 (ending)
                { note: 'C5', duration: 0.25 }, { note: 'E4', duration: 0.25 },
                { note: 'A4', duration: 0.25 }, { note: 'C5', duration: 0.25 },
                { note: 'E5', duration: 0.5 }, { note: 'E5', duration: 0.5 },
                { note: 'E5', duration: 0.75 },
            ];
            this.defaultMelody = furElise;

        this.buildKeyboard();
        this.bindControls();
        this.bindMelodyControls();
        this.bindEffectsControls();
        this.resumeAudioOnInteraction();
      }

      buildKeyboard() {
        this.keyboardEl.innerHTML = '';
        for (const note of this.notes) {
          const btn = document.createElement('button');
          btn.className = 'lute-key';
          btn.dataset.note = note;
          btn.textContent = note.replace('4', '').replace('5', '');
          btn.setAttribute('aria-label', `Play ${note}`);

          const playFn = (e) => {
            e.preventDefault();
            this.playNoteFromGUI(note);
          };
          btn.addEventListener('mousedown', playFn);
          btn.addEventListener('touchstart', playFn, { passive: false });
          this.keyboardEl.appendChild(btn);
        }
      }

      playNoteFromGUI(note) {
        const decay = parseFloat(this.decaySlider.value);
        const gain = parseFloat(this.gainSlider.value);
        const detune = parseFloat(this.detuneSlider.value);
        this.instrument.playNote(note, decay, gain, detune);
        this.updateValueDisplays();
      }

      bindControls() {
        this.decaySlider.addEventListener('input', () => {
          const val = parseFloat(this.decaySlider.value);
          this.decayValue.textContent = val.toFixed(2);
          this.instrument.setDecay(val);
        });

        this.gainSlider.addEventListener('input', () => {
          const val = parseFloat(this.gainSlider.value);
          this.gainValue.textContent = val.toFixed(2);
          this.instrument.setGain(val);
        });

        this.detuneSlider.addEventListener('input', () => {
          const val = parseFloat(this.detuneSlider.value);
          this.detuneValue.textContent = val;
          this.instrument.setDetune(val);
        });

        this.bpmSlider.addEventListener('input', () => {
          const val = parseFloat(this.bpmSlider.value);
          this.bpmValue.textContent = val;
          Tone.Transport.bpm.value = val;
        });

        // Initial values
        this.instrument.setDecay(parseFloat(this.decaySlider.value));
        this.instrument.setGain(parseFloat(this.gainSlider.value));
        this.instrument.setDetune(parseFloat(this.detuneSlider.value));
        this.updateValueDisplays();
        Tone.Transport.bpm.value = parseFloat(this.bpmSlider.value);
        this.bpmValue.textContent = this.bpmSlider.value;
      }

      updateValueDisplays() {
        this.decayValue.textContent = parseFloat(this.decaySlider.value).toFixed(2);
        this.gainValue.textContent = parseFloat(this.gainSlider.value).toFixed(2);
        this.detuneValue.textContent = this.detuneSlider.value;
      }

      bindEffectsControls() {
        this.chorusToggle.addEventListener('change', () => {
          this.updateEffects();
        });
        this.reverbToggle.addEventListener('change', () => {
          this.updateEffects();
        });
        this.updateEffects();
      }

      updateEffects() {
        const chorusOn = this.chorusToggle.checked;
        const reverbOn = this.reverbToggle.checked;
        this.instrument.chorus.wet.value = chorusOn ? 0.6 : 0;
        this.instrument.reverb.wet.value = reverbOn ? 0.25 : 0;

        this.instrument.chorus.wet.value = chorusOn ? 0.95 : 0;
        this.instrument.reverb.wet.value = reverbOn ? 0.5 : 0;
      }

      bindMelodyControls() {
        this.playMelodyBtn.addEventListener('click', () => {
          this.playMelody();
        });
        this.stopMelodyBtn.addEventListener('click', () => {
          this.stopMelody();
        });
      }

      playMelody() {
        if (this.instrument.isMelodyPlaying()) return;

        const bpm = parseFloat(this.bpmSlider.value);
        const decay = parseFloat(this.decaySlider.value);
        const gain = parseFloat(this.gainSlider.value);
        const detune = parseFloat(this.detuneSlider.value);

        this.instrument.setDecay(decay);
        this.instrument.setGain(gain);
        this.instrument.setDetune(detune);

        this.playMelodyBtn.disabled = true;
        this.stopMelodyBtn.disabled = false;

        this.instrument.playMelody(this.defaultMelody, bpm, () => {
          this.onMelodyComplete();
        });
      }

      stopMelody() {
        this.instrument.stopMelody();
        this.onMelodyComplete();
      }

      onMelodyComplete() {
        this.playMelodyBtn.disabled = false;
        this.stopMelodyBtn.disabled = true;
        if (Tone.Transport.state === 'started') {
          Tone.Transport.stop();
          Tone.Transport.cancel();
        }
      }

      resumeAudioOnInteraction() {
        const resume = () => {
          if (Tone.context.state === 'suspended') {
            Tone.context.resume();
          }
        };
        document.addEventListener('click', resume, { once: false });
        document.addEventListener('touchstart', resume, { once: false });
        document.addEventListener('keydown', resume, { once: false });
      }
    }

    // --------------------------------------------------------------
    // 3. INSTANTIATE
    // --------------------------------------------------------------
    const lute = new ChiptuneLute({ decay: 0.5, gain: 0.5, detune: 8 });
    const gui = new LuteGUI(lute);

    window.addEventListener('beforeunload', () => {
      Tone.Transport.stop();
      Tone.Transport.cancel();
      lute.dispose();
    });

  })();
</script>
</body>
</html>
